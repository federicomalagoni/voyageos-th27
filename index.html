async function open_(pw,silent){
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.i)},key,b(P.d)));
    if(document.getElementById('k')?.checked||silent){try{localStorage.setItem('voyageos_pw',pw)}catch(e){}}
    document.open();document.write(html);document.close();return true;
  }catch(e){if(silent){try{localStorage.removeItem('voyageos_pw')}catch(_){}}return false}
}
